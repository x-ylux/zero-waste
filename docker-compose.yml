version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rescueplate-postgres
    restart: always
    environment:
      POSTGRES_USER: rescueplate
      POSTGRES_PASSWORD: rescueplate_password
      POSTGRES_DB: rescueplate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescueplate -d rescueplate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

