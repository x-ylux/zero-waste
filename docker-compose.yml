services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rescuerelay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rescuerelay
      POSTGRES_PASSWORD: rescuerelay_password
      POSTGRES_DB: rescuerelay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuerelay -d rescuerelay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
